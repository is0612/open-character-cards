<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PNG 角色卡 → JSON</title>
<style>
:root{
  --brown:#4a3628; --amber:#c9762b; --parchment:#f5f0e6; --cream:#fffdf8;
  --ink:#2e2119; --muted:#8a7a6c; --line:#e2d8ca;
  --ok:#3f7d4e; --warn:#a8651c; --bad:#a33a2c;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--parchment);color:var(--ink);
  font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
header{padding:40px 24px 8px;text-align:center}
h1{margin:0 0 8px;font-size:26px;font-weight:600;color:var(--brown);letter-spacing:.5px}
header p{margin:0;color:var(--muted);font-size:14px}
main{max-width:940px;margin:0 auto;padding:24px 24px 96px}

#drop{
  border:1.5px dashed var(--line);border-radius:14px;background:var(--cream);
  padding:44px 24px;text-align:center;cursor:pointer;
  transition:border-color .15s,background .15s;
}
#drop:hover,#drop:focus-visible{border-color:var(--amber);outline:none}
#drop.over{border-color:var(--amber);background:#fdf6ea}
#drop .big{font-size:16px;font-weight:500;color:var(--brown);margin-bottom:6px}
#drop .sub{font-size:13px;color:var(--muted)}

.card{background:var(--cream);border:1px solid var(--line);border-radius:14px;margin-top:20px;overflow:hidden}
.card-head{display:flex;gap:16px;align-items:flex-start;padding:18px 20px}
.thumb{width:64px;height:85px;border-radius:8px;object-fit:cover;background:#efe6d8;flex:none;border:1px solid var(--line)}
.meta{flex:1;min-width:0}
.meta h2{margin:0 0 3px;font-size:17px;font-weight:600;color:var(--brown);word-break:break-all}
.file{font-size:12px;color:var(--muted);font-family:var(--mono);word-break:break-all}
.chunkline{font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:6px;word-break:break-all;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:#f0e7d8;color:var(--brown);border:1px solid var(--line)}
.chip.ok{background:#e8f2e9;color:var(--ok);border-color:#cfe2d2}
.chip.warn{background:#fbf0dd;color:var(--warn);border-color:#efdcc0}
.chip.bad{background:#fae9e6;color:var(--bad);border-color:#f0cfc9}
.actions{display:flex;flex-direction:column;gap:8px;flex:none}
button{
  font:inherit;font-size:13px;padding:7px 14px;border-radius:8px;
  border:1px solid var(--line);background:var(--cream);color:var(--brown);
  cursor:pointer;transition:.15s;white-space:nowrap;
}
button:hover{border-color:var(--amber);color:var(--amber)}
button.primary{background:var(--amber);border-color:var(--amber);color:#fff}
button.primary:hover{background:#b3661f;color:#fff}

.sect{padding:0 20px}
.sect h3{margin:16px 0 8px;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.5px}
table.fields{width:100%;border-collapse:collapse;font-size:13px}
table.fields td{padding:5px 0;border-bottom:1px dashed var(--line);vertical-align:top}
table.fields td:first-child{width:190px;color:var(--muted);font-family:var(--mono);font-size:12px}
table.fields td:last-child{font-family:var(--mono);font-size:12px;word-break:break-all}
table.fields tr:last-child td{border-bottom:0}
.dim{color:var(--muted)}

.warns{list-style:none;margin:0;padding:0}
.warns li{font-size:13px;padding:8px 11px;border-radius:8px;margin-bottom:6px;line-height:1.55}
.warns li.warn{background:#fbf0dd;color:#7a4a12}
.warns li.bad{background:#fae9e6;color:#8b2f22}
.warns li.ok{background:#e8f2e9;color:#2f5f3a}
.warns li code{font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.05);padding:1px 4px;border-radius:4px}

details{border-top:1px solid var(--line);margin-top:16px}
summary{padding:12px 20px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
summary:hover{color:var(--amber)}
pre{margin:0;padding:0 20px 18px;font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-all;max-height:420px;overflow:auto;color:#3a2d22}
.err{margin-top:20px;padding:16px 20px;border-radius:12px;background:#fae9e6;color:#8b2f22;font-size:14px;border:1px solid #f0cfc9}
.err b{font-weight:600}
</style>
</head>
<body>
<header>
  <h1>PNG 角色卡 → JSON</h1>
  <p>读 chara / ccv3 文本块，导出干净 JSON，并标出卡型与导入风险</p>
</header>
<main>
  <div id="drop" tabindex="0" role="button" aria-label="选择或拖入角色卡文件">
    <div class="big">把角色卡 PNG 拖进来</div>
    <div class="sub">也可以点击选择 · 支持批量 · 顺带认 .json</div>
    <input id="file" type="file" accept=".png,.json,image/png,application/json" multiple hidden />
  </div>
  <div id="list"></div>
</main>
<script>
(function () {
  'use strict';

  var SIG = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];
  var decU8 = new TextDecoder('utf-8');
  var decL1 = new TextDecoder('latin1');

  var drop = document.getElementById('drop');
  var fileInput = document.getElementById('file');
  var list = document.getElementById('list');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function num(n) { return Number(n).toLocaleString('en-US'); }
  function kb(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(2) + ' MB';
  }

  function walkChunks(buf) {
    var u8 = new Uint8Array(buf);
    if (u8.length < 8) throw new Error('文件太短，不是 PNG');
    for (var i = 0; i < 8; i++) if (u8[i] !== SIG[i]) throw new Error('不是 PNG 文件');
    var dv = new DataView(buf);
    var out = [];
    var off = 8;
    while (off + 8 <= u8.length) {
      var len = dv.getUint32(off);
      var type = String.fromCharCode(u8[off + 4], u8[off + 5], u8[off + 6], u8[off + 7]);
      var data = u8.subarray(off + 8, off + 8 + len);
      var kw = '';
      if (type === 'tEXt' || type === 'zTXt' || type === 'iTXt') {
        var z = data.indexOf(0);
        if (z > 0) kw = decL1.decode(data.subarray(0, z));
      }
      out.push({ type: type, len: len, kw: kw, data: data });
      off += 12 + len;
      if (type === 'IEND') break;
    }
    return out;
  }

  async function inflate(bytes) {
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('当前环境不支持解压 zTXt/iTXt');
    }
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function readTextChunks(chunks) {
    var map = {};
    for (var i = 0; i < chunks.length; i++) {
      var c = chunks[i];
      if (c.type !== 'tEXt' && c.type !== 'zTXt' && c.type !== 'iTXt') continue;
      var d = c.data;
      var z = d.indexOf(0);
      if (z < 0) continue;
      var key = decL1.decode(d.subarray(0, z));
      var text = '';
      try {
        if (c.type === 'tEXt') {
          text = decU8.decode(d.subarray(z + 1));
        } else if (c.type === 'zTXt') {
          text = decU8.decode(await inflate(d.subarray(z + 2)));
        } else {
          var flag = d[z + 1];
          var p = d.indexOf(0, z + 2) + 1;
          p = d.indexOf(0, p) + 1;
          var body = d.subarray(p);
          text = decU8.decode(flag ? await inflate(body) : body);
        }
      } catch (e) {
        continue;
      }
      if (map[key] === undefined) map[key] = text;
    }
    return map;
  }

  function b64ToText(b64) {
    var clean = String(b64).replace(/[\s\r\n]/g, '');
    var bin = atob(clean);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return decU8.decode(bytes);
  }

  function tryParse(raw) {
    var t = String(raw).trim();
    if (t.charAt(0) === '{' || t.charAt(0) === '[') {
      try { return JSON.parse(t); } catch (e) { /* 继续试 base64 */ }
    }
    try { return JSON.parse(b64ToText(t)); } catch (e) { return null; }
  }

  function summarize(card) {
    var root = (card && typeof card === 'object') ? card : {};
    var d = (root.data && typeof root.data === 'object') ? root.data : root;
    var ext = (d.extensions && typeof d.extensions === 'object') ? d.extensions : {};
    var book = d.character_book || root.character_book || null;
    var entries = (book && Array.isArray(book.entries)) ? book.entries : [];
    var regex = Array.isArray(ext.regex_scripts) ? ext.regex_scripts : [];
    var th = (ext.tavern_helper && typeof ext.tavern_helper === 'object') ? ext.tavern_helper : {};
    var scripts = Array.isArray(th.scripts) ? th.scripts : [];

    function str(k) { return typeof d[k] === 'string' ? d[k] : ''; }

    var regexChars = regex.reduce(function (n, r) {
      return n + (r && typeof r.replaceString === 'string' ? r.replaceString.length : 0);
    }, 0);
    var scriptChars = scripts.reduce(function (n, s) {
      return n + (s && typeof s.content === 'string' ? s.content.length : 0);
    }, 0);

    var frameEntries = entries.filter(function (e) {
      var label = String((e && (e.comment || e.name)) || '');
      return /^\[(mvu_update|initvar|mvu_initvar)\]/i.test(label) || /变量列表/.test(label);
    });

    var textChars = ['description', 'personality', 'scenario', 'first_mes', 'mes_example']
      .reduce(function (n, k) { return n + str(k).length; }, 0);

    var type = '传统卡';
    if (regex.length || scripts.length) type = '应用包';
    else if (!str('description').trim() && entries.length) type = '世界书型';

    return {
      d: d, ext: ext, entries: entries, regex: regex, scripts: scripts,
      regexChars: regexChars, scriptChars: scriptChars,
      frameEntries: frameEntries, textChars: textChars,
      altCount: Array.isArray(d.alternate_greetings) ? d.alternate_greetings.length : 0,
      groupAltCount: Array.isArray(d.group_only_greetings) ? d.group_only_greetings.length : 0,
      type: type,
      name: str('name') || root.name || '（未命名）',
      firstMes: str('first_mes'),
      hasBook: !!(book && entries.length)
    };
  }

  function buildWarnings(info, chunks) {
    var out = [];

    var holders = (info.firstMes.match(/<[A-Za-z_][\w.]*PlaceHolder[\w.]*\s*\/?>/g) || []);
    if (holders.length) {
      var uniq = holders.filter(function (v, i, a) { return a.indexOf(v) === i; });
      out.push({ level: 'bad', html: '开场白里有占位符 <code>' + esc(uniq[0]) + '</code>' +
        (uniq.length > 1 ? ' 等 ' + uniq.length + ' 种' : '') +
        '，要靠正则替换才能变成界面。导入方不执行正则时，这串标签会原样留在正文里。' });
    }

    if (info.regex.length) {
      out.push({ level: 'warn', html: '带 <b>' + info.regex.length + ' 条正则管道</b>，替换体合计 ' +
        num(info.regexChars) + ' 字（' + kb(info.regexChars * 2) + ' 量级）。不执行 = 占位符不渲染、变量标签不剥离。' });
    }
    if (info.scripts.length) {
      var names = info.scripts.map(function (s) { return s && s.name ? s.name : '?'; }).slice(0, 6).join(' / ');
      out.push({ level: 'warn', html: '带 <b>' + info.scripts.length + ' 段脚本</b>（' + num(info.scriptChars) +
        ' 字）：<code>' + esc(names) + '</code>。这类内容会执行 JS，导入方需要沙箱或直接忽略。' });
    }
    if (info.frameEntries.length) {
      var labels = info.frameEntries.map(function (e) { return (e && (e.comment || e.name)) || '?'; });
      out.push({ level: 'warn', html: '世界书里有 <b>' + info.frameEntries.length + ' 条框架元条目</b>（' +
        esc(labels.join(' / ')) + '），不是剧情设定。当普通条目导入会污染提示词。' });
    }
    if (!String(info.d.description || '').trim()) {
      out.push({ level: 'warn', html: '<code>description</code> 是空的' +
        (info.hasBook ? '，设定全在 <code>character_book</code> 的 ' + info.entries.length + ' 条条目里' : '') +
        '。按描述字段读卡的软件会看到一个空角色。' });
    }

    var hasChara = chunks.some(function (c) { return c.kw === 'chara'; });
    var hasCcv3 = chunks.some(function (c) { return c.kw === 'ccv3'; });
    if (hasChara && hasCcv3) {
      out.push({ level: 'ok', html: '<code>chara</code> + <code>ccv3</code> 双写，老软件认 V2、新软件认 V3，兼容性最好。' });
    } else if (hasCcv3) {
      out.push({ level: 'warn', html: '只有 <code>ccv3</code> 块。读卡实现必须会解 <b>base64</b>，直接 <code>JSON.parse</code> 会失败。' });
    } else if (hasChara) {
      out.push({ level: 'warn', html: '只有 <code>chara</code> 块（V2）。V3 的 <code>assets</code>、<code>group_only_greetings</code> 可能缺失。' });
    }

    if (!out.length) out.push({ level: 'ok', html: '没有发现需要特别注意的结构。' });
    return out;
  }

  function fieldRows(info, card) {
    var d = info.d;
    function len(k) {
      var v = d[k];
      return typeof v === 'string' ? num(v.length) + ' 字' : '—';
    }
    var rows = [];
    rows.push(['name', esc(info.name)]);
    rows.push(['spec_version', esc(d.spec_version || (card && card.spec_version) || '—')]);
    rows.push(['description', len('description')]);
    rows.push(['personality', len('personality')]);
    rows.push(['scenario', len('scenario')]);
    rows.push(['first_mes', len('first_mes')]);
    rows.push(['mes_example', len('mes_example')]);
    rows.push(['system_prompt', len('system_prompt')]);
    rows.push(['post_history_instructions', len('post_history_instructions')]);
    rows.push(['alternate_greetings', info.altCount + ' 条' + (info.groupAltCount ? ' + 群聊 ' + info.groupAltCount + ' 条' : '')]);
    rows.push(['character_book', info.hasBook ? info.entries.length + ' 条（框架元条目 ' + info.frameEntries.length + ' 条）' : '<span class="dim">无</span>']);
    var extKeys = Object.keys(info.ext);
    rows.push(['extensions', extKeys.length ? esc(extKeys.join(', ')) : '<span class="dim">无</span>']);
    rows.push(['tags', Array.isArray(d.tags) && d.tags.length ? esc(d.tags.join(', ')) : '<span class="dim">无</span>']);
    rows.push(['creator', esc(d.creator || '<span class="dim">无</span>')]);
    var code = info.regexChars + info.scriptChars;
    var total = code + info.textChars;
    var pct = total ? Math.round((code / total) * 100) : 0;
    rows.push(['文本 / 代码', num(info.textChars) + ' 字 / ' + num(code) + ' 字（代码占 ' + pct + '%）']);
    return rows;
  }

  function renderOne(file, card, chunks, source, error) {
    var el = document.createElement('article');
    el.className = 'card';

    if (error) {
      var box = document.createElement('div');
      box.className = 'err';
      box.innerHTML = '<b>' + esc(file.name) + '</b><br>' + esc(error);
      el.appendChild(box);
      list.appendChild(el);
      return;
    }

    var info = summarize(card);
    var json = JSON.stringify(card, null, 2);
    var url = /^image\//.test(file.type) ? URL.createObjectURL(file) : '';

    var chunkLine = chunks.length
      ? chunks.map(function (c) {
          return c.type + (c.kw ? '(' + c.kw + ')' : '') + ' ' + num(c.len);
        }).join('  ·  ')
      : '';

    var chipType = info.type === '应用包' ? 'warn' : (info.type === '世界书型' ? 'ok' : '');
    var chips = '<span class="chip ' + chipType + '">' + esc(info.type) + '</span>' +
      '<span class="chip">来源 ' + esc(source || 'JSON') + '</span>' +
      '<span class="chip">JSON ' + kb(json.length * 2) + '</span>';

    var warns = buildWarnings(info, chunks).map(function (w) {
      return '<li class="' + w.level + '">' + w.html + '</li>';
    }).join('');

    var rows = fieldRows(info, card).map(function (r) {
      return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>';
    }).join('');

    el.innerHTML =
      '<div class="card-head">' +
        '<img class="thumb" alt=""' + (url ? ' src="' + url + '"' : '') + '>' +
        '<div class="meta">' +
          '<h2>' + esc(info.name) + '</h2>' +
          '<div class="file">' + esc(file.name) + '  ·  ' + kb(file.size) + '</div>' +
          (chunkLine ? '<div class="chunkline">' + esc(chunkLine) + '</div>' : '') +
          '<div class="chips">' + chips + '</div>' +
        '</div>' +
        '<div class="actions">' +
          '<button class="primary" data-act="download">下载 JSON</button>' +
          '<button data-act="copy">复制</button>' +
        '</div>' +
      '</div>' +
      '<div class="sect"><h3>字段</h3><table class="fields">' + rows + '</table></div>' +
      '<div class="sect"><h3>诊断</h3><ul class="warns">' + warns + '</ul></div>' +
      '<details><summary>原始 JSON（' + num(json.length) + ' 字符）</summary><pre></pre></details>';

    el.querySelector('pre').textContent = json;

    el.querySelector('[data-act="download"]').addEventListener('click', function () {
      var blob = new Blob([json], { type: 'application/json;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = file.name.replace(/\.(png|json)$/i, '') + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    });

    el.querySelector('[data-act="copy"]').addEventListener('click', function () {
      var btn = this;
      var done = function () {
        btn.textContent = '已复制';
        setTimeout(function () { btn.textContent = '复制'; }, 1400);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(json).then(done, function () { fallbackCopy(json, done); });
      } else {
        fallbackCopy(json, done);
      }
    });

    list.appendChild(el);
  }

  function fallbackCopy(text, cb) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) { /* 忽略 */ }
    ta.remove();
  }

  async function processOne(file) {
    var card = null;
    var chunks = [];
    var source = 'JSON';
    var error = '';

    try {
      var buf = await file.arrayBuffer();
      if (/\.json$/i.test(file.name)) {
        card = JSON.parse(decU8.decode(new Uint8Array(buf)));
      } else {
        chunks = walkChunks(buf);
        var texts = await readTextChunks(chunks);
        var raw = texts['ccv3'] || texts['chara'];
        if (!raw) throw new Error('这张 PNG 里没有 chara / ccv3 文本块');
        source = texts['ccv3'] ? 'ccv3' : 'chara';
        card = tryParse(raw);
        if (!card) throw new Error('文本块解出来不是合法 JSON');
      }
    } catch (e) {
      error = (e && e.message) ? e.message : String(e);
    }

    renderOne(file, card, chunks, source, error);
  }

  async function handle(files) {
    for (var i = 0; i < files.length; i++) {
      await processOne(files[i]);
    }
  }

  drop.addEventListener('click', function () { fileInput.click(); });
  drop.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });
  fileInput.addEventListener('change', function () {
    var files = Array.prototype.slice.call(fileInput.files);
    fileInput.value = '';
    if (files.length) handle(files);
  });

  ['dragenter', 'dragover'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) {
    var files = Array.prototype.slice.call(e.dataTransfer.files || []);
    if (files.length) handle(files);
  });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
